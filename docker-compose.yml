services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: grant_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: grant_portal_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grant_portal_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Cache Service (Redis)
  cache:
    image: redis:7-alpine
    container_name: grant_portal_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Application Service (Express MVC Backend & Web UI)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grant_portal_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/grant_portal_db
      REDIS_URL: redis://cache:6379
      JWT_SECRET: super_secret_jwt_key_grant_portal_production_change_me
      JWT_EXPIRES_IN: 24h
      ADMIN_EMAIL: admin@grantportal.io
      ADMIN_PASSWORD: AdminPassword123!
      ADMIN_NAME: System Administrator
      OAUTH_CLIENT_ID: dummy_oauth_client_id
      OAUTH_CLIENT_SECRET: dummy_oauth_client_secret
      OAUTH_REDIRECT_URI: http://localhost:3000/api/auth/google/callback
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
    driver: local
